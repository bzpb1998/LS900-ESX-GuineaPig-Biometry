name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock-windows-py312.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip install Flask==3.1.2 waitress==3.0.2
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit public tree
        run: python build_tools/audit_public_tree.py
      - name: Generate icon
        run: python build_tools/create_icon.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LS900-Biometry-Analyzer.spec
      - name: Create archive and checksum
        run: python build_tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: v0.2.0 — V5 native Windows desktop
          body_path: RELEASE_NOTES_v0.2.0.md
          files: release/*
