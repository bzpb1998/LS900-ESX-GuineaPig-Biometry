[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ls900-esx-guineapig-biometry"
version = "0.3.0"
description = "OcularSpan: independent ocular biometry research from exported ESX data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Junbiao Zhang"}]
dependencies = ["numpy==2.2.6", "lxml==5.4.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.10.0", "Pillow==11.3.0"]

[project.scripts]
ocularspan = "ls900_biometry.cli:main"
ls900-biometry = "ls900_biometry.cli:main"

[project.gui-scripts]
ocularspan-desktop = "ls900_biometry.desktop:main"
ls900-desktop = "ls900_biometry.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ls900_biometry = ["models/*.json", "assets/*.xlsx", "assets/*.svg"]
